app: gemini
displayName: Google Gemini
category: ai
enabled: true
auth:
  type: query
  queryParam: key
baseUrl: "https://generativelanguage.googleapis.com/v1beta"
operations:
  - id: list_models
    displayName: List models
    method: GET
    path: /v1beta/models
    params: []
  - id: generate
    displayName: Generate content
    method: POST
    path: "/v1beta/models/{{model}}:generateContent"
    params: [model]
triggers:
