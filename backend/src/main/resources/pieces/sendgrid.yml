app: sendgrid
displayName: SendGrid
category: communication
enabled: true
auth:
  type: bearer
  prefix: Bearer
baseUrl: "https://api.sendgrid.com/v3"
operations:
  - id: send_mail
    displayName: Send mail
    method: POST
    path: /mail/send
    params: [to, subject]
  - id: list_templates
    displayName: List templates
    method: GET
    path: /templates
    params: []
triggers:
