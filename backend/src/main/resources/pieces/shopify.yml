app: shopify
displayName: Shopify
category: ecommerce
enabled: true
auth:
  type: header
  header: X-Shopify-Access-Token
baseUrl: "https://{{shop}}.myshopify.com/admin/api/2024-10"
operations:
  - id: list_products
    displayName: List products
    method: GET
    path: /products.json
    params: [shop]
  - id: create_product
    displayName: Create product
    method: POST
    path: /products.json
    params: [shop]
triggers:
  - id: new_product
    displayName: New product
    method: GET
    path: /products.json
    params: [shop]
    cursor: id
