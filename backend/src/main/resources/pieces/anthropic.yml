app: anthropic
displayName: Anthropic Claude
category: ai
enabled: true
auth:
  type: header
  header: x-api-key
baseUrl: "https://api.anthropic.com/v1"
headers:
  anthropic-version: 2023-06-01
operations:
  - id: list_models
    displayName: List models
    method: GET
    path: /v1/models
    params: []
