server:
  port: ${BACKEND_PORT:8080}
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:automation_studio}
    username: ${DB_USER:automation}
    password: ${DB_PASSWORD:automation}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

engine:
  max-concurrent-executions: ${ENGINE_MAX_CONCURRENT_EXECUTIONS:8}
  workflow-max-duration-ms: ${WORKFLOW_MAX_DURATION_MS:900000}
  node-default-timeout-ms: ${NODE_DEFAULT_TIMEOUT_MS:60000}
